[project]
name = "verdia-ai"
version = "0.1.0"
description = "verdia VLM grass classifier prototype (HTTP API deferred)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.16.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "jupyter>=1.1.0",
    "pillow>=10.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdia_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/verdia_ai/prompts/system.md" = "verdia_ai/prompts/system.md"
"src/verdia_ai/prompts/user.md" = "verdia_ai/prompts/user.md"

[tool.ruff]
exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
